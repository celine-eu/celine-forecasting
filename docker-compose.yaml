services:
  mlflow-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: securepassword123
    entrypoint:
      - /bin/sh
      - -c
      - |
        until pg_isready -h 172.17.0.1 -p 15432 -U postgres; do sleep 2; done
        psql -h 172.17.0.1 -p 15432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'mlflow'" | grep -q 1 || \
        psql -h 172.17.0.1 -p 15432 -U postgres -c "CREATE DATABASE mlflow"
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow-artifacts
      "

  mlflow-server:
    build:
      context: ./mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://postgres:securepassword123@172.17.0.1:15432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # Auth plugin (celine-mlflow-auth)
      MLFLOW_AUTH_CONFIG_PATH: /etc/mlflow/celine_auth.ini
      MLFLOW_FLASK_SERVER_SECRET_KEY: "${MLFLOW_FLASK_SERVER_SECRET_KEY:-change-me-in-production}"
      # Local dev defaults point to the celine-policies Keycloak
      CELINE_MLFLOW_AUTH_JWKS_URL: "${CELINE_MLFLOW_AUTH_JWKS_URL:-http://keycloak.celine.localhost/realms/celine/protocol/openid-connect/certs}"
      CELINE_MLFLOW_AUTH_JWT_AUDIENCE: "${CELINE_MLFLOW_AUTH_JWT_AUDIENCE:-}"
      CELINE_MLFLOW_AUTH_CLI_ADMIN_AZP: "${CELINE_MLFLOW_AUTH_CLI_ADMIN_AZP:-celine-cli}"
      CELINE_MLFLOW_AUTH_SYNC_CACHE_TTL: "${CELINE_MLFLOW_AUTH_SYNC_CACHE_TTL:-60}"
      CELINE_MLFLOW_AUTH_DATABASE_URI: "${CELINE_MLFLOW_AUTH_DATABASE_URI:-postgresql://postgres:securepassword123@172.17.0.1:15432/mlflow}"
      CELINE_MLFLOW_AUTH_ADMIN_PASSWORD: "${CELINE_MLFLOW_AUTH_ADMIN_PASSWORD:-changeme-strong-password}"
    extra_hosts:
      - "keycloak.celine.localhost:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --app-name celine-auth
        --allowed-hosts mlflow.celine.localhost,localhost
        --cors-allowed-origins http://mlflow.celine.localhost
        --backend-store-uri postgresql://postgres:securepassword123@172.17.0.1:15432/mlflow
        --default-artifact-root s3://mlflow-artifacts
        --artifacts-destination s3://mlflow-artifacts

volumes: {}
