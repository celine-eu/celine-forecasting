services:
  mlflow-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: securepassword123
    entrypoint:
      - /bin/sh
      - -c
      - |
        until pg_isready -h 172.17.0.1 -p 15432 -U postgres; do sleep 2; done
        psql -h 172.17.0.1 -p 15432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'mlflow'" | grep -q 1 || \
        psql -h 172.17.0.1 -p 15432 -U postgres -c "CREATE DATABASE mlflow"
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow-artifacts
      "

  mlflow-server:
    build:
      context: ./mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://postgres:securepassword123@172.17.0.1:15432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://postgres:securepassword123@172.17.0.1:15432/mlflow
        --default-artifact-root s3://mlflow-artifacts
        --artifacts-destination s3://mlflow-artifacts

volumes: {}
