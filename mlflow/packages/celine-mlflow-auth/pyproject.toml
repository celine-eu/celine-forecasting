[project]
name = "celine-mlflow-auth"
version = "0.1.0"
description = "CELINE MLflow auth plugin: JWT/oauth2-proxy SSO with Keycloak group mapping"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.0.0",
    "cryptography>=44.0.0",
    "Flask-WTF<2",
    "pyjwt>=2.10.0",
    "requests>=2.32.0",
]

[project.entry-points."mlflow.app"]
celine-auth = "celine.mlflow_auth.auth:create_app"

[dependency-groups]
dev = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.hatch.build.targets.sdist]
include = ["src/celine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
