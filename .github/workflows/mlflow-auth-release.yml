name: Build & Push MLflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVICE_PATH: "mlflow"
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}

    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            version:
              - "mlflow/packages/celine-mlflow-auth/version.txt"
              - "mlflow/Dockerfile"

      - id: check
        run: |
          if [ "${{ steps.filter.outputs.version }}" = "true" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve versions
        id: versions
        run: |
          MLFLOW_VERSION=$(grep -oP 'MLFLOW_VERSION=\K[0-9.]+' ${SERVICE_PATH}/Dockerfile)
          PLUGIN_VERSION=$(cat ${SERVICE_PATH}/packages/celine-mlflow-auth/version.txt | tr -d '[:space:]')
          VERSION="${MLFLOW_VERSION}-${PLUGIN_VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "MLflow ${MLFLOW_VERSION} + plugin ${PLUGIN_VERSION} → ${VERSION}"

      - name: Build & push MLflow image
        run: |
          IMAGE=${REGISTRY}/${{ github.repository_owner }}/mlflow
          VERSION=${{ steps.versions.outputs.version }}

          echo "Building ${IMAGE}:${VERSION}"

          docker build \
            -f ${SERVICE_PATH}/Dockerfile \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:latest \
            ${SERVICE_PATH}

          docker push ${IMAGE}:${VERSION}
          docker push ${IMAGE}:latest
