[project]
name = "celine-meter-forecasting"
version = "0.1.0"
description = "Open-source 48h energy forecasting for smart meters (per-device LightGBM + CQR intervals)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "CELINE / SpindoxLabs" }]
keywords = ["energy", "forecasting", "smart-meter", "lightgbm", "mlflow", "time-series"]

dependencies = [
    "lightgbm>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.10.0", "boto3>=1.28.0"]
db = ["sqlalchemy>=2.0.0", "psycopg2-binary>=2.9.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
]

[project.scripts]
meter-forecast = "celine.meter_forecasting.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
