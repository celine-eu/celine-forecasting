version: "3"

vars:
  CONFIG: config.local.yaml
  OUTPUT: out

tasks:
  install:
    desc: Install all dependencies
    cmds:
      - uv sync --extra mlflow --extra db --extra dev

  test:
    desc: Run test suite
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  validate:
    desc: Validate meter data from the database
    cmds:
      - uv run meter-forecast validate --datasets-config {{.CONFIG}} {{.CLI_ARGS}}

  run:
    desc: Daily run — incremental retrain + forecast
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}} {{.CLI_ARGS}}

  run:full:
    desc: Full retrain from scratch
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}} --full-retrain {{.CLI_ARGS}}

  evaluate:
    desc: Evaluate previous forecasts against actuals
    cmds:
      - uv run meter-forecast evaluate --datasets-config {{.CONFIG}} --forecasts-dir {{.OUTPUT}} {{.CLI_ARGS}}

  train:
    desc: Full training with backtest
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast train --datasets-config {{.CONFIG}} --output {{.OUTPUT}} --backtest {{.CLI_ARGS}}

  cleanup:
    desc: Clean up old MLflow runs (default 7 days)
    cmds:
      - uv run meter-forecast cleanup --datasets-config {{.CONFIG}} {{.CLI_ARGS}}

  cleanup:dry:
    desc: Preview what cleanup would delete
    cmds:
      - uv run meter-forecast cleanup --datasets-config {{.CONFIG}} --dry-run {{.CLI_ARGS}}

  mlflow:
    desc: Start MLflow + MinIO
    cmds:
      - docker compose up -d

  mlflow:stop:
    desc: Stop MLflow + MinIO
    cmds:
      - docker compose down

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check src/ tests/

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format src/ tests/
