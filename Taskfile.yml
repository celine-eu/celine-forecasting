version: "3"

vars:
  CONFIG: config.local.yaml
  OUTPUT: out

tasks:
  install:
    desc: Install all dependencies
    cmds:
      - uv sync --extra mlflow --extra db --extra dev

  test:
    desc: Run test suite
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  validate:
    desc: Validate meter data from the database
    cmds:
      - uv run meter-forecast validate --datasets-config {{.CONFIG}} {{.CLI_ARGS}}

  # ── LightGBM (default backend) ──────────────────────────────────────────────

  run:
    desc: "Daily run — incremental retrain + forecast (lightgbm)"
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/lightgbm {{.CLI_ARGS}}

  run:full:
    desc: Full retrain from scratch (lightgbm)
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/lightgbm --full-retrain {{.CLI_ARGS}}

  train:
    desc: Full training with backtest (lightgbm)
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast train --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/lightgbm --backtest {{.CLI_ARGS}}

  evaluate:
    desc: Evaluate previous forecasts against actuals
    cmds:
      - uv run meter-forecast evaluate --datasets-config {{.CONFIG}} --forecasts-dir {{.OUTPUT}} {{.CLI_ARGS}}

  # ── Neural backends (GPU, mutually exclusive groups) ─────────────────────────

  run:ttm:
    desc: "Train with TTM (IBM Tiny Time Mixer, fine-tunes)"
    deps: [mlflow]
    cmds:
      - uv sync --extra mlflow --extra db --group ttm
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/ttm --model ttm -j 1 {{.CLI_ARGS}}

  run:chronos-bolt:
    desc: "Train with Chronos-Bolt (Amazon, zero-shot univariate)"
    deps: [mlflow]
    cmds:
      - uv sync --extra mlflow --extra db --group chronos
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/chronos_bolt --model chronos_bolt -j 1 {{.CLI_ARGS}}

  run:chronos2:
    desc: "Train with Chronos-2 (Amazon, zero-shot with covariates)"
    deps: [mlflow]
    cmds:
      - uv sync --extra mlflow --extra db --group chronos
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/chronos2 --model chronos2 -j 1 {{.CLI_ARGS}}

  run:timesfm:
    desc: "Train with TimesFM 2.5 (Google, zero-shot univariate)"
    deps: [mlflow]
    cmds:
      - uv sync --extra mlflow --extra db --group timesfm25
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/timesfm25 --model timesfm25 -j 1 {{.CLI_ARGS}}

  run:moirai:
    desc: "Train with Moirai (Salesforce, zero-shot with covariates)"
    deps: [mlflow]
    cmds:
      - uv sync --extra mlflow --extra db --group moirai
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.OUTPUT}}/moirai --model moirai -j 1 {{.CLI_ARGS}}

  # ── Smoke tests (verify backend loads on GPU) ───────────────────────────────

  smoke:ttm:
    desc: Smoke test TTM backend
    cmds:
      - uv sync --group ttm
      - uv run python -m celine.meter_forecasting.models.ttm.smoke_ttm

  smoke:chronos:
    desc: Smoke test Chronos-Bolt + Chronos-2 backends
    cmds:
      - uv sync --group chronos
      - uv run python -m celine.meter_forecasting.models.chronos_bolt.smoke_chronos_bolt
      - uv run python -m celine.meter_forecasting.models.chronos2.smoke_chronos2

  smoke:timesfm:
    desc: Smoke test TimesFM 2.5 backend
    cmds:
      - uv sync --group timesfm25
      - uv run python -m celine.meter_forecasting.models.timesfm25.smoke_timesfm25

  smoke:moirai:
    desc: Smoke test Moirai backend
    cmds:
      - uv sync --group moirai
      - uv run python -m celine.meter_forecasting.models.moirai.smoke_moirai

  # ── Infrastructure ──────────────────────────────────────────────────────────

  cleanup:
    desc: Clean up old MLflow runs (default 7 days)
    cmds:
      - uv run meter-forecast cleanup --datasets-config {{.CONFIG}} {{.CLI_ARGS}}

  cleanup:dry:
    desc: Preview what cleanup would delete
    cmds:
      - uv run meter-forecast cleanup --datasets-config {{.CONFIG}} --dry-run {{.CLI_ARGS}}

  mlflow:
    desc: Start MLflow + MinIO
    cmds:
      - docker compose up -d

  mlflow:stop:
    desc: Stop MLflow + MinIO
    cmds:
      - docker compose down

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check src/ tests/

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format src/ tests/
