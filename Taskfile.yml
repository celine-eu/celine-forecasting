version: "3"

vars:
  CONFIG: config.local.yaml
  METER_OUTPUT: out/meter
  REC_OUTPUT: out/rec

tasks:
  install:
    desc: Install all dependencies
    cmds:
      - uv sync --extra mlflow --extra db --extra dev

  test:
    desc: Run test suite
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  # ── Meter pipeline ─────────────────────────────────────────────────────

  meter:validate:
    desc: Validate meter data from the database
    cmds:
      - uv run meter-forecast validate --datasets-config {{.CONFIG}} {{.CLI_ARGS}}

  meter:run:
    desc: "Meter: daily run — incremental retrain + forecast"
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.METER_OUTPUT}} {{.CLI_ARGS}}

  meter:run:full:
    desc: "Meter: full retrain from scratch"
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast run --datasets-config {{.CONFIG}} --output {{.METER_OUTPUT}} --full-retrain {{.CLI_ARGS}}

  meter:evaluate:
    desc: "Meter: evaluate previous forecasts against actuals"
    cmds:
      - uv run meter-forecast evaluate --datasets-config {{.CONFIG}} --forecasts-dir {{.METER_OUTPUT}} {{.CLI_ARGS}}

  meter:train:
    desc: "Meter: full training with backtest"
    deps: [install, mlflow]
    cmds:
      - uv run meter-forecast train --datasets-config {{.CONFIG}} --output {{.METER_OUTPUT}} --backtest {{.CLI_ARGS}}

  meter:cleanup:
    desc: "Meter: clean up old MLflow runs (default 7 days)"
    cmds:
      - uv run meter-forecast cleanup --datasets-config {{.CONFIG}} {{.CLI_ARGS}}

  meter:cleanup:dry:
    desc: "Meter: preview what cleanup would delete"
    cmds:
      - uv run meter-forecast cleanup --datasets-config {{.CONFIG}} --dry-run {{.CLI_ARGS}}

  # ── REC pipeline ───────────────────────────────────────────────────────

  rec:validate:
    desc: "REC: validate meter data from the database"
    cmds:
      - uv run rec-forecast validate --datasets-config {{.CONFIG}} {{.CLI_ARGS}}

  rec:run:
    desc: "REC: daily run — train + forecast"
    deps: [install, mlflow]
    cmds:
      - uv run rec-forecast run --datasets-config {{.CONFIG}} --output {{.REC_OUTPUT}} {{.CLI_ARGS}}

  rec:run:full:
    desc: "REC: full retrain from scratch"
    deps: [install, mlflow]
    cmds:
      - uv run rec-forecast run --datasets-config {{.CONFIG}} --output {{.REC_OUTPUT}} --full-retrain {{.CLI_ARGS}}

  rec:evaluate:
    desc: "REC: evaluate forecasts against actuals"
    cmds:
      - uv run rec-forecast evaluate --forecasts {{.REC_OUTPUT}}/forecasts.csv --actuals {{.CLI_ARGS}}

  rec:train:
    desc: "REC: train with cross-validation"
    deps: [install, mlflow]
    cmds:
      - uv run rec-forecast train --datasets-config {{.CONFIG}} --output {{.REC_OUTPUT}} --cv {{.CLI_ARGS}}

  # ── Infrastructure ─────────────────────────────────────────────────────

  mlflow:
    desc: Start MLflow + MinIO
    cmds:
      - docker compose up -d

  mlflow:stop:
    desc: Stop MLflow + MinIO
    cmds:
      - docker compose down

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check src/ tests/

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format src/ tests/
